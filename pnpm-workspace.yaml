allowBuilds:
  esbuild: false

blockExoticSubdeps: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@better-css-modules/*'
  - '@k8o/*'
  - '@k8ordo/*'

verifyDepsBeforeRun: install

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

# vite-plus は Vite を @voidzero-dev/vite-plus-core として持つ。vite を求める依存にも
# そのコアを渡し、vite ^8 を peer に求める依存にはコアの版番号を許す（vp migrate の配置）
overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
